services:
  # ── Infrastructure ───────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - '3307:3306'  # host:3307 → container:3306 (avoids conflict with local MySQL)
    volumes:
      - mysql_data:/var/lib/mysql
      - ./back/src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p${MYSQL_ROOT_PASSWORD}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Backend ───────────────────────────────────────────────────────────────────
  back:
    build:
      context: ./back
      target: development
    ports:
      - '4000:4000'
    env_file: ./back/.env
    volumes:
      - ./back/src:/app/src  # hot reload
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run dev

  # ── Frontend ──────────────────────────────────────────────────────────────────
  front:
    build:
      context: ./front
      target: development
    ports:
      - '5173:5173'
    env_file: ./front/.env
    volumes:
      - ./front/src:/app/src  # hot reload
    depends_on:
      - back
    command: npm run dev

volumes:
  mysql_data:
  redis_data:
